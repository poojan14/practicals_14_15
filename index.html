<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIP Practicals 14A to 15B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F7FA; --surface-2:#EBF1F8; --line:#DCE3EB;
  --ink:#1A2433; --ink-2:#4A5568; --muted:#718096;
  --blue:#1F4E8C; --blue-ink:#173D6E; --blue-soft:#E7EFF9;
  --green:#2E7D5B; --green-soft:#E6F3EC; --red:#B4472F; --red-soft:#FBEAE5;
  --yellow-soft:#FFF4CC; --code-bg:#F5F7FA; --code-com:#2E7D5B; --code-str:#9A4A12;
  /* aliases used by shared drawing code */
  --paper:var(--bg); --teal:var(--blue);
  --serif:"Source Serif 4", Cambria, Georgia, serif;
  --sans:"Source Sans 3", Calibri, "Segoe UI", Arial, sans-serif;
  --mono:"Source Code Pro", Consolas, "Courier New", monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A21; --surface:#1C232C; --surface-2:#22303F; --line:#2F3B49;
    --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9;
    --blue:#7FAEE8; --blue-ink:#A8C8F0; --blue-soft:#1F3049;
    --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420;
    --yellow-soft:#3B3418; --code-bg:#1C232C; --code-com:#7CCB9F; --code-str:#E4A06A;
  }
}
:root[data-theme="dark"]{
  --bg:#151A21; --surface:#1C232C; --surface-2:#22303F; --line:#2F3B49;
  --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9;
  --blue:#7FAEE8; --blue-ink:#A8C8F0; --blue-soft:#1F3049;
  --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420;
  --yellow-soft:#3B3418; --code-bg:#1C232C; --code-com:#7CCB9F; --code-str:#E4A06A;
}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px)); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.6}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
img,canvas{max-width:100%}
[hidden]{display:none !important}
a{color:var(--blue)}
code{font-family:var(--mono); font-size:.9em; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:0 5px}

/* top bar */
.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:10px 18px; padding-top:calc(10px + env(safe-area-inset-top,0px)); margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top .menu{border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:5px 12px; cursor:pointer}
.top .ttl{font-family:var(--serif); font-weight:700; font-size:18px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top .ttl span{color:var(--muted); font-family:var(--sans); font-weight:400; font-size:15px; margin-left:8px}
.top .theme{border:1px solid var(--line); background:var(--bg); border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:18px; line-height:1}
.prog{height:3px; background:var(--line); position:sticky; top:calc(57px + env(safe-area-inset-top,0px)); z-index:19}
.prog i{display:block; height:100%; background:var(--blue); width:0; transition:width .3s}

/* layout */
.layout{display:grid; grid-template-columns:280px minmax(0,1fr); max-width:1320px; margin:0 auto}
.toc{position:sticky; top:calc(60px + env(safe-area-inset-top,0px)); height:calc(100vh - 60px - env(safe-area-inset-top,0px)); overflow:auto; padding:22px 14px 40px 22px; border-right:1px solid var(--line)}
.toc h4{font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 6px 8px}
.toc h4:first-child{margin-top:0}
.toc ol{list-style:none; margin:0; padding:0}
.toc a{display:flex; gap:8px; align-items:baseline; padding:5px 8px; border-radius:6px; text-decoration:none; color:var(--ink-2); font-size:15px; line-height:1.35}
.toc a:hover{background:var(--surface)}
.toc a[aria-current="page"]{background:var(--blue-soft); color:var(--blue-ink); font-weight:600}
.toc .tick{width:14px; flex:none; color:var(--green); font-size:13px}
.scrim{display:none}

main{padding:36px clamp(18px,5vw,64px) 40px; min-width:0}
.sec{max-width:880px}
.kicker{color:var(--blue); font-weight:600; font-size:15px; margin:0 0 4px}
h1{font-family:var(--serif); font-size:clamp(30px,4vw,42px); line-height:1.15; margin:0 0 14px}
h2{font-family:var(--serif); font-size:clamp(26px,3.2vw,34px); line-height:1.2; margin:0 0 12px}
h3{font-family:var(--serif); font-size:21px; margin:30px 0 8px}
p{margin:0 0 14px}
.lead{font-size:19px; color:var(--ink-2); max-width:64ch}
.prose{max-width:68ch}
.prose ul,.prose ol{padding-left:22px; margin:0 0 14px}
.prose li{margin-bottom:6px}
.muted{color:var(--muted)}

.btn{border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:8px; padding:8px 16px; cursor:pointer; font-weight:600}
:root[data-theme="dark"] .btn{color:#10161D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10161D}}
.btn.ghost{background:transparent; color:var(--blue); border-color:var(--line)}
.btn.sm{padding:5px 12px; font-size:15px}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}

.plan{list-style:none; padding:0; margin:0; counter-reset:p; border-top:1px solid var(--line)}
.plan li{border-bottom:1px solid var(--line)}
.plan a{display:grid; grid-template-columns:44px 1fr; gap:4px 12px; padding:12px 4px; text-decoration:none; color:var(--ink)}
.plan a:hover{background:var(--surface)}
.plan .n{font-family:var(--serif); font-weight:700; font-size:22px; color:var(--blue); grid-row:span 2}
.plan b{font-weight:600}
.plan span{color:var(--ink-2); font-size:15px}

.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:14px 0}
.box{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--bg)}
.box h4{margin:0 0 6px; font-size:17px}
.box p{margin:0; color:var(--ink-2); font-size:16px}
.callout{border-left:4px solid var(--blue); background:var(--blue-soft); padding:12px 16px; border-radius:0 8px 8px 0; margin:18px 0; max-width:72ch}
.callout.green{border-color:var(--green); background:var(--green-soft)}
.formula{font-family:var(--serif); font-size:20px; padding:8px 16px; background:var(--surface); border-radius:8px; display:inline-block; margin:4px 8px 12px 0}
.stat{display:flex; gap:24px; flex-wrap:wrap; margin:16px 0}
.stat div{min-width:120px}
.stat b{display:block; font-family:var(--serif); font-size:34px; color:var(--blue); line-height:1}
.stat span{font-size:15px; color:var(--ink-2)}

/* try-it widgets */
.try{border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px; margin:22px 0; background:var(--surface)}
.try-h{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.badge{font-size:13px; font-weight:700; background:var(--blue); color:#fff; border-radius:4px; padding:1px 8px}
:root[data-theme="dark"] .badge{color:#10161D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#10161D}}
.try-h b{font-size:18px}
.try-h .sub{color:var(--muted); font-size:15px}
.controls{display:flex; flex-wrap:wrap; gap:12px 22px; align-items:center; margin:8px 0 14px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--bg)}
.seg button{border:0; background:none; padding:6px 12px; cursor:pointer; font-size:15px; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10161D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10161D}}
.slider{display:flex; align-items:center; gap:10px; font-size:15px}
.slider input{width:170px; accent-color:var(--blue)}
.slider output{font-family:var(--mono); min-width:4ch; font-weight:600}
.views{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,300px)); gap:14px}
.view figure{margin:0}
.view canvas{width:100%; height:auto; aspect-ratio:1/1; border-radius:6px; background:#000; display:block; border:1px solid var(--line)}
.view figcaption{font-size:14px; color:var(--ink-2); margin-top:5px; display:flex; justify-content:space-between; gap:8px}
.view figcaption span:last-child{font-family:var(--mono); color:var(--muted)}
.hist canvas{aspect-ratio:2/1; background:var(--bg)}
.note{font-size:15px; color:var(--ink-2); margin:12px 0 0; max-width:72ch}

.masks{display:flex; flex-wrap:wrap; gap:18px; margin:8px 0}
.mtab{border-collapse:collapse; font-family:var(--mono); font-size:15px}
.mtab td{border:1px solid var(--line); width:40px; height:34px; text-align:center; background:var(--bg)}
.mtab td.c{background:var(--blue-soft); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px}
.chip{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:5px 14px; cursor:pointer; font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--blue); background:var(--blue-soft); color:var(--blue-ink); font-weight:600}

.pix-wrap{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:20px; align-items:start}
.pix-wrap canvas{width:100%; aspect-ratio:1/1; cursor:crosshair; border-radius:6px; border:1px solid var(--line); touch-action:none}
.ptab{border-collapse:collapse; font-family:var(--mono); font-size:13px}
.ptab td{width:40px; height:30px; text-align:center; border:1px solid rgba(127,127,127,.25)}
.ptab td.ctr{outline:3px solid var(--blue); outline-offset:-3px; font-weight:700}

.grid-pair{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start}
.bgrid{display:grid; gap:2px; background:var(--line); border:2px solid var(--line); width:max-content}
.bgrid button{width:22px; height:22px; border:0; padding:0; background:#1A2433; cursor:pointer}
.bgrid button.on{background:#FFFFFF}
.bgrid button.lost{background:var(--red)}
.bgrid button.gain{background:#8FD3A8}
.bgrid.out button{cursor:default}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--ink-2); margin-top:8px}
.legend i{display:inline-block; width:12px; height:12px; border:1px solid var(--line); margin-right:5px; vertical-align:-1px}

/* commands */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; margin:12px 0}
table.t{width:100%; border-collapse:collapse; font-size:16px}
table.t th{text-align:left; font-weight:600; padding:9px 14px; background:var(--surface); border-bottom:1px solid var(--line); font-size:15px}
table.t td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.mono{font-family:var(--mono); font-size:15px; color:var(--blue-ink); min-width:150px; overflow-wrap:anywhere}
table.t td:nth-child(2){min-width:200px}
table.t td.ex code{white-space:pre-wrap; overflow-wrap:anywhere; display:inline-block; max-width:420px}
table.t input{width:100%; min-width:80px; border:1px solid var(--line); border-radius:6px; padding:4px 8px; background:var(--bg)}

/* steps */
.use{margin:0 0 6px; font-size:15px; color:var(--ink-2)}
.see{margin:0 0 8px; font-size:15px; color:var(--ink-2); max-width:68ch}
.peek{margin:6px 0 10px}
.peek summary{cursor:pointer; color:var(--blue); font-size:15px; font-weight:600}
.peek .code{margin-top:8px}
.tickbox{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; background:var(--bg); font-weight:600; font-size:15px}
.tickbox input{width:18px; height:18px; accent-color:var(--green)}
.step.ok .tickbox{border-color:var(--green); background:var(--green-soft)}
.ide{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:14px 0 22px}
.ide div{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--surface)}
.ide b:first-child{display:block; margin-bottom:4px}
.counter{display:flex; align-items:center; gap:12px; margin:6px 0 18px; font-weight:600; color:var(--ink-2)}
.counter .bar{width:220px; max-width:50%; height:8px; border-radius:4px; background:var(--line); overflow:hidden}
.counter .bar i{display:block; height:100%; background:var(--green); width:0; transition:width .3s}
.steps{list-style:none; margin:0; padding:0}
.step{display:grid; grid-template-columns:40px minmax(0,1fr); gap:0 16px; padding-bottom:24px; position:relative}
.step::before{content:""; position:absolute; left:19px; top:40px; bottom:4px; width:2px; background:var(--line)}
.step:last-child::before{display:none}
.step .num{width:40px; height:40px; border-radius:50%; border:2px solid var(--line); background:var(--bg); display:grid; place-items:center; font-weight:700; color:var(--ink-2); position:relative; z-index:1}
.step.ok .num{background:var(--green); border-color:var(--green); color:#fff}
.step.locked{opacity:.45}
.step h4{margin:7px 0 4px; font-size:18px}
.step .ins{margin:0 0 10px; color:var(--ink-2); max-width:68ch}
.code{background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:11px 14px; font-family:var(--mono); font-size:15px; white-space:pre; overflow-x:auto; line-height:1.75; color:var(--ink)}
.code .com{color:var(--code-com); font-style:italic}
.code input{font-family:var(--mono); font-size:15px; background:var(--yellow-soft); border:0; border-bottom:2px solid #D4A72C; border-radius:3px 3px 0 0; padding:0 4px; color:var(--ink)}
.code input.right{background:var(--green-soft); border-bottom-color:var(--green)}
.code input.wrong{background:var(--red-soft); border-bottom-color:var(--red)}
.fb{font-size:15px}
.fb.good{color:var(--green)} .fb.bad{color:var(--red)}
.why{font-size:15px; color:var(--ink-2); border-left:3px solid var(--green); padding:2px 12px; margin-top:10px; max-width:68ch}
details.full{margin:18px 0}
details.full summary{cursor:pointer; font-weight:600; color:var(--blue)}
details.full .code{margin-top:10px; line-height:1.6}

/* quiz */
.q{margin:0 0 20px}
.q > p{margin:0 0 8px; font-weight:600}
.opts{display:flex; flex-direction:column; gap:6px; max-width:620px}
.opt{border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; background:var(--bg); text-align:left}
.opt:hover{border-color:var(--blue)}
.opt.right{border-color:var(--green); background:var(--green-soft)}
.opt.wrong{border-color:var(--red); background:var(--red-soft)}
.qexp{font-size:15px; color:var(--ink-2); margin-top:6px}

/* reveal cards */
.reveal{border:1px solid var(--line); border-radius:10px; margin:10px 0; background:var(--bg)}
.reveal summary{cursor:pointer; padding:12px 16px; font-weight:600; list-style:none; display:flex; justify-content:space-between; gap:10px}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary::after{content:"+"; color:var(--blue); font-size:20px; line-height:1}
.reveal[open] summary::after{content:"\2212"}
.reveal .body{padding:0 16px 14px; color:var(--ink-2)}
.reveal .body p{margin:0 0 6px}

.result-img{width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; margin:8px 0}
.console{font-family:var(--mono); font-size:14.5px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 14px; white-space:pre; overflow-x:auto; margin:10px 0}

.search{width:100%; max-width:480px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:var(--bg); margin:6px 0 12px}

.pager{display:flex; justify-content:space-between; align-items:center; gap:12px; max-width:880px; margin-top:44px; padding-top:18px; border-top:1px solid var(--line)}
.pager .mid{color:var(--muted); font-size:14px; text-align:center}
.hint-keys{color:var(--muted); font-size:14px}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:15px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50}
.toast.show{opacity:1}

/* account + tasks */
.acct{display:flex; align-items:center; gap:8px}
.acct .who{font-size:14px; color:var(--ink-2); text-align:right; line-height:1.2; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.acct .who b{color:var(--ink); display:block; overflow:hidden; text-overflow:ellipsis}
.acct .btn{padding:6px 12px; font-size:15px}
.gbtn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:600; font-size:15px}
.gbtn svg{width:18px; height:18px}
.authcard{border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--surface); margin:16px 0; max-width:640px}
.authcard h4{margin:0 0 6px; font-size:17px}
.authcard p{margin:0 0 10px; color:var(--ink-2)}
.form{display:grid; gap:12px; max-width:460px}
.form label{display:grid; gap:4px; font-weight:600; font-size:15px}
.form input[type=text]{border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--bg); font-weight:400}
.form small{font-weight:400; color:var(--muted)}
.err{color:var(--red); font-size:15px}
.ok-msg{color:var(--green); font-size:15px; font-weight:600}
.dl-row{display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 18px}
.dl{display:flex; gap:12px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:10px 14px 10px 10px; background:var(--bg); text-decoration:none; color:var(--ink)}
.dl img{width:72px; height:72px; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:#000}
.dl b{display:block}
.dl span{font-size:14px; color:var(--blue); font-weight:600}
.tq{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:0 0 12px; background:var(--bg)}
.tq .ql{font-weight:600; margin:0 0 8px; display:block}
.tq .qn{color:var(--blue); margin-right:6px}
.tq input[type=text], .tq textarea{width:100%; max-width:320px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--bg)}
.tq textarea{max-width:100%; min-height:72px; resize:vertical}
.tq .ch{display:flex; flex-direction:column; gap:6px}
.tq .ch label{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; background:var(--bg)}
.tq .ch label:has(input:checked){border-color:var(--blue); background:var(--blue-soft)}
.tq .ch input{margin-top:5px; accent-color:var(--blue)}
.tq .pts{float:right; font-size:13px; color:var(--muted); font-weight:400}
.locked-ans{font-family:var(--mono); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:4px 10px; display:inline-block}
.status{display:inline-flex; gap:8px; align-items:center; font-weight:600; border-radius:999px; padding:4px 12px; font-size:14px}
.status.sub{background:var(--green-soft); color:var(--green)}
.status.not{background:var(--surface); color:var(--ink-2); border:1px solid var(--line)}
.mk{width:100%; border-collapse:collapse; margin:10px 0}
.mk th,.mk td{border-bottom:1px solid var(--line); padding:9px 12px; text-align:left}
.mk th{background:var(--surface); font-size:15px}
.mk td.n{font-family:var(--mono); font-weight:600}

.scorebar{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 16px; margin:0 0 12px}
.scorebar b{font-family:var(--serif); font-size:26px; color:var(--blue)}
.tq.good{border-color:var(--green); background:var(--green-soft)}
.tq.retry{border-color:#D4A72C}
.tq.bad{border-color:var(--red); background:var(--red-soft)}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1600); }
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(line, lang){
  const ch = lang==="py" ? "#" : "%"; let q=null;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c===q) q=null; continue; }
    if(c==="'"||c==='"'){ q=c; continue; }
    if(c===ch) return esc(line.slice(0,i))+`<span class="com">${esc(line.slice(i))}</span>`; }
  return esc(line);
}
const codeBlock=(src,lang)=>`<div class="code">${src.split('\n').map(l=>hl(l,lang)).join('\n')}</div>`;

/* ================= SHARED IMAGE PROCESSING ================= */
const N = 256;
const cache = {};
function loadGray(key){
  if (cache[key]) return Promise.resolve(cache[key]);
  return new Promise(res=>{
    const im = new Image(); im.onload = ()=>{
      const c = document.createElement('canvas'); c.width=N; c.height=N;
      const x = c.getContext('2d'); x.drawImage(im,0,0,N,N);
      const d = x.getImageData(0,0,N,N).data; const g = new Uint8ClampedArray(N*N);
      for (let i=0;i<N*N;i++) g[i] = Math.round(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]);
      cache[key]=g; res(g);
    }; im.src = IMG[key];
  });
}
function draw(cv, arr, w=N, h=N){
  cv.width=w; cv.height=h; const x=cv.getContext('2d'); const id=x.createImageData(w,h);
  for (let i=0;i<w*h;i++){ const v=arr[i]; id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v; id.data[i*4+3]=255; }
  x.putImageData(id,0,0);
}
const clampIdx = (v,m)=> v<0?0:(v>=m?m-1:v);
function conv(g, k, kw){
  const r = (kw-1)>>1, out = new Float32Array(N*N);
  const kh = k.length/kw, rh=(kh-1)>>1;
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    let s=0;
    for (let j=0;j<kh;j++) for (let i=0;i<kw;i++) s += k[j*kw+i]*g[clampIdx(y+j-rh,N)*N + clampIdx(x+i-r,N)];
    out[y*N+x]=s;
  }
  return out;
}
function gradMag(g, kx, ky, kw){
  const gx=conv(g,kx,kw), gy=conv(g,ky,kw); const m=new Float32Array(N*N); let mx=0;
  for (let i=0;i<N*N;i++){ m[i]=Math.hypot(gx[i],gy[i]); if(m[i]>mx) mx=m[i]; }
  return {m,gx,gy,mx};
}
function gaussKernel(sigma){
  const r = Math.max(1, Math.ceil(sigma*2.5)); const k=[]; let s=0;
  for (let i=-r;i<=r;i++){ const v=Math.exp(-(i*i)/(2*sigma*sigma)); k.push(v); s+=v; }
  return k.map(v=>v/s);
}
function blur(g, sigma){
  const k=gaussKernel(sigma); const r=(k.length-1)>>1; const t=new Float32Array(N*N), o=new Float32Array(N*N);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ let s=0; for(let i=-r;i<=r;i++) s+=k[i+r]*g[y*N+clampIdx(x+i,N)]; t[y*N+x]=s; }
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){ let s=0; for(let i=-r;i<=r;i++) s+=k[i+r]*t[clampIdx(y+i,N)*N+x]; o[y*N+x]=s; }
  return o;
}
function edgeOp(g, op, t){
  const out = new Uint8ClampedArray(N*N);
  if (op==="prewitt"||op==="sobel"){
    const kx = op==="sobel"?[-1,0,1,-2,0,2,-1,0,1]:[-1,0,1,-1,0,1,-1,0,1];
    const ky = op==="sobel"?[-1,-2,-1,0,0,0,1,2,1]:[-1,-1,-1,0,0,0,1,1,1];
    const {m,mx}=gradMag(g,kx,ky,3); for(let i=0;i<N*N;i++) out[i]= m[i]>t*mx?255:0;
  } else if (op==="roberts"){
    const {m,mx}=gradMag(g,[1,0,0,-1],[0,1,-1,0],2); for(let i=0;i<N*N;i++) out[i]= m[i]>t*mx?255:0;
  } else if (op==="laplacian"){
    const L=conv(g,[0,1,0,1,-4,1,0,1,0],3); let mx=0; for(const v of L) mx=Math.max(mx,Math.abs(v));
    const th=t*mx*0.5;
    for (let y=0;y<N-1;y++) for (let x=0;x<N-1;x++){
      const a=L[y*N+x], b=L[y*N+x+1], c=L[(y+1)*N+x];
      if ((a*b<0 && Math.abs(a-b)>th) || (a*c<0 && Math.abs(a-c)>th)) out[y*N+x]=255;
    }
  } else if (op==="canny"){
    return canny(g, t*0.4, t, 1.4);
  }
  return out;
}
function canny(g, lowF, highF, sigma){
  const b = blur(g, sigma);
  const {m,gx,gy,mx} = gradMag(b,[-1,0,1,-2,0,2,-1,0,1],[-1,-2,-1,0,0,0,1,2,1],3);
  const nms = new Float32Array(N*N);
  for (let y=1;y<N-1;y++) for (let x=1;x<N-1;x++){
    const i=y*N+x; let a=Math.atan2(gy[i],gx[i])*180/Math.PI; if(a<0) a+=180;
    let p,q;
    if (a<22.5||a>=157.5){ p=m[i-1]; q=m[i+1]; }
    else if (a<67.5){ p=m[i-N+1]; q=m[i+N-1]; }
    else if (a<112.5){ p=m[i-N]; q=m[i+N]; }
    else { p=m[i-N-1]; q=m[i+N+1]; }
    nms[i] = (m[i]>=p && m[i]>=q) ? m[i] : 0;
  }
  const hi=highF*mx, lo=lowF*mx; const out=new Uint8ClampedArray(N*N); const stack=[];
  for (let i=0;i<N*N;i++) if (nms[i]>=hi){ out[i]=255; stack.push(i); }
  while (stack.length){ const i=stack.pop(); const y=(i/N)|0, x=i%N;
    for (let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const yy=y+dy, xx=x+dx; if(yy<0||xx<0||yy>=N||xx>=N) continue;
      const j=yy*N+xx; if(!out[j] && nms[j]>=lo){ out[j]=255; stack.push(j);} } }
  return out;
}
function otsu(g){
  const h=new Array(256).fill(0); for(const v of g) h[v]++;
  let sum=0; for(let i=0;i<256;i++) sum+=i*h[i];
  let sB=0,wB=0,best=0,th=0; const tot=g.length;
  for (let t=0;t<256;t++){ wB+=h[t]; if(!wB) continue; const wF=tot-wB; if(!wF) break; sB+=t*h[t];
    const mB=sB/wB, mF=(sum-sB)/wF; const v=wB*wF*(mB-mF)*(mB-mF); if(v>best){best=v; th=t;} }
  return th;
}
function binaryObj(g){ const t=otsu(g); const b=new Uint8ClampedArray(N*N); for(let i=0;i<N*N;i++) b[i]= g[i]<=t?255:0; return b; }
function morphSquare(b, k, erode){
  const r=(k-1)>>1, pad = erode?255:0, t=new Uint8ClampedArray(N*N), o=new Uint8ClampedArray(N*N);
  const f = erode?Math.min:Math.max;
  for (let y=0;y<N;y++) for(let x=0;x<N;x++){ let v=erode?255:0; for(let i=-r;i<=r;i++){ const xx=x+i; const p= (xx<0||xx>=N)?pad:b[y*N+xx]; v=f(v,p);} t[y*N+x]=v; }
  for (let y=0;y<N;y++) for(let x=0;x<N;x++){ let v=erode?255:0; for(let i=-r;i<=r;i++){ const yy=y+i; const p= (yy<0||yy>=N)?pad:t[yy*N+x]; v=f(v,p);} o[y*N+x]=v; }
  return o;
}
function diskOffsets(r){ const o=[]; for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r+0.5) o.push([x,y]); return o; }
function morphDisk(b, r, erode){
  const off=diskOffsets(r), pad=erode?255:0, o=new Uint8ClampedArray(N*N);
  for (let y=0;y<N;y++) for(let x=0;x<N;x++){
    let v = erode?255:0;
    for (const [dx,dy] of off){ const xx=x+dx, yy=y+dy; const p=(xx<0||yy<0||xx>=N||yy>=N)?pad:b[yy*N+xx];
      if (erode){ if(!p){v=0;break;} } else { if(p){v=255;break;} } }
    o[y*N+x]=v;
  }
  return o;
}
const count = a=>{ let c=0; for(const v of a) if(v) c++; return c; };
function histOf(g){ const h=new Array(256).fill(0); for(const v of g) h[v]++; return h; }
function equalize(g){ const h=histOf(g); const cdf=[]; let s=0; for(let i=0;i<256;i++){ s+=h[i]; cdf.push(s);} const mn=cdf.find(v=>v>0); const tot=g.length;
  const o=new Uint8ClampedArray(g.length); for(let i=0;i<g.length;i++) o[i]=Math.round((cdf[g[i]]-mn)/(tot-mn)*255); return o; }
function drawHist(cv, g, label){
  const css = getComputedStyle(document.documentElement);
  const W=512, H=256; cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle = css.getPropertyValue('--paper'); x.fillRect(0,0,W,H);
  const h=histOf(g); const sorted=[...h].sort((a,b)=>b-a); const mx = sorted[1]*1.15 || 1; // second-highest so one spike doesn't flatten everything
  x.fillStyle = css.getPropertyValue('--teal');
  for (let i=0;i<256;i++){ const v=Math.min(h[i],mx)/mx*(H-24); x.fillRect(i*2, H-12-v, 2, v); }
  x.fillStyle = css.getPropertyValue('--muted'); x.font='14px sans-serif'; x.fillText('0',2,H-1); x.fillText('255',W-28,H-1); x.fillText(label,8,18);
}

const norm=s=>s.trim().replace(/\s+/g,'').replace(/"/g,"'");
function stepsBlock(key, steps, lang){ return `<div data-steps="${key}"></div>`; }
function fillCode(c){ return c.replace(/\{\{(.+?)\}\}/g,(m,a)=>a.split('|')[0]); }
function cmdsIn(c){ const out=[]; c.replace(/\{\{(.+?)\}\}/g,(m,a)=>{ const v=a.split('|')[0]; if(/^[A-Za-z_][\w.]*$/.test(v)&&!/^\d/.test(v)) out.push(v); return m; }); return [...new Set(out)]; }
function renderSteps(root, key, steps, lang){
  const host=root.querySelector(`[data-steps="${key}"]`);
  const st=S.steps[key]=S.steps[key]||{};
  const n=steps.length;
  const paint=()=>{
    const done=Object.values(st).filter(Boolean).length;
    host.querySelector('.counter span').textContent=`${done} of ${n} done in ${lang==='py'?'Python':'MATLAB'}`;
    host.querySelector('.counter i').style.width=(done/n*100)+'%';
  };
  host.innerHTML=`<div class="counter"><span></span><span class="bar"><i></i></span></div><ol class="steps"></ol>`;
  const ol=host.querySelector('ol');
  steps.forEach((s,i)=>{
    const ok=!!st[i]; const cm=cmdsIn(s.c);
    const li=document.createElement('li');
    li.className='step'+(ok?' ok':'');
    li.innerHTML=`<span class="num">${ok?'&#10003;':i+1}</span><div>
      <h4>${s.t}</h4><p class="ins">${s.i}</p>
      ${cm.length?`<p class="use">Use: ${cm.map(c=>`<code>${esc(c)}</code>`).join(' ')}</p>`:''}
      ${s.chk?`<p class="see"><b>Check in ${lang==='py'?'Python':'MATLAB'}:</b> ${s.chk}</p>`:''}
      <details class="peek"><summary>Stuck? Show the code for this step</summary>${codeBlock(fillCode(s.c),lang)}${s.w?`<div class="why">${s.w}</div>`:''}</details>
      <label class="tickbox"><input type="checkbox" ${ok?'checked':''}> I've done this in ${lang==='py'?'my Python file':'MATLAB'}</label></div>`;
    ol.appendChild(li);
    li.querySelector('.tickbox input').onchange=e=>{
      st[i]=e.target.checked; save(); syncProgress(); li.classList.toggle('ok',e.target.checked);
      li.querySelector('.num').innerHTML=e.target.checked?'&#10003;':i+1; paint(); renderToc();
      if(e.target.checked){ toast(`Step ${i+1} done`); if(Object.values(st).filter(Boolean).length===n) toast('All steps done: run it and check the Results page'); }
    };
  });
  paint();
}

      const sx=k=>30+k*(W-36)/(N-1), sy=v=>10+(1-v/255)*(H-30);
      c.lineWidth=1.6; c.strokeStyle='#D06A2B'; c.beginPath();
      for(let k=1;k<N;k++){ const d=Math.abs(g[(row-1)*N+k]-g[(row-1)*N+k-1]); const yy=sy(Math.min(255,d*2)); k===1?c.moveTo(sx(k),yy):c.lineTo(sx(k),yy); } c.stroke();
      c.strokeStyle=css.getPropertyValue('--blue'); c.lineWidth=2; c.beginPath();
      for(let k=0;k<N;k++){ const yy=sy(g[(row-1)*N+k]); k?c.lineTo(sx(k),yy):c.moveTo(sx(k),yy); } c.stroke();
    };
    el.querySelector('#pr').oninput=e=>{ row=+e.target.value; el.querySelector('#pro').textContent=row; run(); };
    ci.onclick=e=>{ const r=ci.getBoundingClientRect(); row=Math.max(1,Math.min(N,Math.floor((e.clientY-r.top)/r.height*N)+1)); el.querySelector('#pr').value=row; el.querySelector('#pro').textContent=row; run(); };
    run();
  });
}
/* mask explorer + by-hand convolution */
const MASKS={
  prewitt:{m:[[-1,0,1],[-1,0,1],[-1,0,1]], n:"Prewitt Gx. Equal weights. Gy is the same mask turned 90 degrees."},
  sobel:{m:[[-1,0,1],[-2,0,2],[-1,0,1]], n:"Sobel Gx. The middle row counts double, which smooths a little and reduces noise."},
  roberts:{m:[[1,0],[0,-1]], n:"Roberts. A 2x2 diagonal difference. Very fast, but sensitive to noise."},
  laplacian:{m:[[0,1,0],[1,-4,1],[0,1,0]], n:"Laplacian. Second derivative: the result crosses zero exactly on an edge."}
};
function demoMasks(el){
  let k="sobel";
  el.innerHTML = tryBox("Tap a detector to see its mask","",
    `<div class="chips" id="mchips">${Object.keys(MASKS).map(x=>`<button class="chip" data-k="${x}" aria-pressed="${x===k}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
     <div class="row" style="gap:20px; align-items:flex-start"><div id="mshow"></div><p id="mnote" style="max-width:46ch; margin:0"></p></div>`);
  const run=()=>{ el.querySelector('#mshow').innerHTML=mtab(MASKS[k].m); el.querySelector('#mnote').textContent=MASKS[k].n; };
  el.querySelectorAll('#mchips .chip').forEach(b=>b.onclick=()=>{ k=b.dataset.k; el.querySelectorAll('#mchips .chip').forEach(x=>x.setAttribute('aria-pressed',x===b)); run(); });
  run();
}
function demoConvolve(el){
  el.innerHTML = tryBox("Be the computer: apply Sobel Gx by hand","A real 3x3 patch from the cameraman's coat edge",
    `<div class="row" style="gap:24px; align-items:flex-start"><div><div class="muted" style="font-size:14px">Pixel patch</div><div id="cvp"></div></div>
     <div style="font-size:28px; padding-top:40px">&times;</div><div><div class="muted" style="font-size:14px">Sobel Gx</div>${mtab(MASKS.sobel.m)}</div></div>
     <p style="margin:14px 0 6px">Multiply each pixel by the mask number in the same place, then add all nine products. What is G<sub>x</sub>?</p>
     <div class="row"><input id="cva" inputmode="numeric" style="width:120px; border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:var(--bg)" aria-label="Your answer for Gx"><button class="btn sm" id="cvc">Check</button><button class="btn ghost sm" id="cvs">Show working</button><span class="fb" id="cvf"></span></div>
     <div id="cvw" class="note"></div>`);
  loadGray('cam').then(g=>{
    // find strong horizontal gradient in coat area
    let best=0,bx=0,by=0; const K=MASKS.sobel.m;
    for(let y=120;y<200;y++) for(let x=40;x<110;x++){ let s=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) s+=K[j+1][i+1]*g[(y+j)*N+x+i]; if(Math.abs(s)>Math.abs(best)&&Math.abs(s)<500){best=s;bx=x;by=y;} }
    const P=[]; for(let j=-1;j<=1;j++){ const r=[]; for(let i=-1;i<=1;i++) r.push(g[(by+j)*N+bx+i]); P.push(r); }
    el.querySelector('#cvp').innerHTML=mtab(P);
    const ans=P.flat().reduce((a,v,i)=>a+v*K.flat()[i],0);
    el.querySelector('#cvc').onclick=()=>{ const v=+el.querySelector('#cva').value; const f=el.querySelector('#cvf');
      if(v===ans){ f.className='fb good'; f.textContent=`Correct: ${ans}. A large value means a strong vertical edge.`; } else { f.className='fb bad'; f.textContent='Not yet. Remember the minus signs on the left column.'; } };
    el.querySelector('#cvs').onclick=()=>{ const terms=P.flat().map((v,i)=>K.flat()[i]===0?null:`(${K.flat()[i]}&times;${v})`).filter(Boolean);
      el.querySelector('#cvw').innerHTML=`Zeros drop out, leaving: ${terms.join(' + ')} = <b>${ans}</b>. MATLAB's edge() does this at every pixel, for both G<sub>x</sub> and G<sub>y</sub>.`; };
  });
}
/* binary grid morphology */
function demoGrid(el){
  const R=13, C=13;
  const init=()=>{ const a=new Array(R*C).fill(0);
    for(let y=2;y<5;y++) for(let x=2;x<11;x++) a[y*C+x]=1;      // T top bar
    for(let y=5;y<11;y++) for(let x=5;x<8;x++) a[y*C+x]=1;      // T stem
    a[6*C+6]=0;                                                // hole
    a[9*C+10]=1;                                               // speck
    for(let y=8;y<11;y++) a[y*C+1]=1;                           // thin line
    return a; };
  let A = (S.inputs.grid && S.inputs.grid.length===R*C) ? S.inputs.grid.slice() : init();
  let se="square", op="erode";
  el.innerHTML = tryBox("Erode and dilate a tiny image by hand","Click cells to draw. White = object.",
    `<div class="controls">${seg([["erode","Erode"],["dilate","Dilate"],["open","Open"],["close","Close"]],op,"gop")}${seg([["square","3x3 square"],["cross","3x3 cross"]],se,"gse")}<button class="btn ghost sm" id="grs">Reset shape</button></div>
     <div class="grid-pair"><div><div class="muted" style="font-size:14px; margin-bottom:4px">Input (click to edit)</div><div class="bgrid" id="gin" style="grid-template-columns:repeat(${C},22px)"></div></div>
     <div><div class="muted" style="font-size:14px; margin-bottom:4px">Output</div><div class="bgrid out" id="gout" style="grid-template-columns:repeat(${C},22px)"></div></div></div>
     <div class="legend"><span><i style="background:#fff"></i>object</span><span><i style="background:var(--red)"></i>removed</span><span><i style="background:#8FD3A8"></i>added</span></div>
     <p class="note" id="gnote"></p>`);
  const offs=()=> se==="square" ? [-1,0,1].flatMap(j=>[-1,0,1].map(i=>[i,j])) : [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
  const er=a=>a.map((_,k)=>{ const y=(k/C)|0,x=k%C; return offs().every(([i,j])=>{ const yy=y+j,xx=x+i; return yy>=0&&xx>=0&&yy<R&&xx<C&&a[yy*C+xx]; })?1:0; });
  const di=a=>a.map((_,k)=>{ const y=(k/C)|0,x=k%C; return offs().some(([i,j])=>{ const yy=y+j,xx=x+i; return yy>=0&&xx>=0&&yy<R&&xx<C&&a[yy*C+xx]; })?1:0; });
  const notes={erode:"Erosion: a cell stays white only if the whole SE fits on white. The thin line and the speck vanish; the hole grows.",
    dilate:"Dilation: a cell turns white if the SE touches any white. The hole fills, the speck grows, edges thicken.",
    open:"Opening = erode, then dilate. The speck and thin line are gone, but the T keeps its size. The hole remains.",
    close:"Closing = dilate, then erode. The hole is filled and the T keeps its size. The speck remains."};
  const run=()=>{
    const B = op==="erode"?er(A): op==="dilate"?di(A): op==="open"?di(er(A)): er(di(A));
    el.querySelector('#gin').innerHTML=A.map((v,k)=>`<button class="${v?'on':''}" data-k="${k}" aria-label="cell ${k}, ${v?'white':'black'}"></button>`).join('');
    el.querySelector('#gout').innerHTML=B.map((v,k)=>`<button tabindex="-1" class="${v?(A[k]?'on':'gain'):(A[k]?'lost':'')}" aria-hidden="true"></button>`).join('');
    el.querySelector('#gnote').textContent=notes[op]+` (${A.filter(Boolean).length} white in, ${B.filter(Boolean).length} white out)`;
    el.querySelectorAll('#gin button').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; A[k]=A[k]?0:1; S.inputs.grid=A; save(); run(); });
  };
  bindSeg(el.querySelector('#gop'),v=>{op=v; run();});
  bindSeg(el.querySelector('#gse'),v=>{se=v; run();});
  el.querySelector('#grs').onclick=()=>{ A=init(); S.inputs.grid=A; save(); run(); };
  run();
}

  bindSeg(el.querySelector('#bseg'),v=>{mode=v; run();}); run();
}

function fieldHTML(q, val, disabled){
  const name=`q_${q.id}`;
  if(q.type==="num") return `<input type="text" inputmode="decimal" name="${name}" value="${esc(val??"")}" autocomplete="off" aria-label="${esc(q.label)}" ${disabled?"disabled":""}>`;
  return `<div class="ch" role="radiogroup" aria-label="${esc(q.label)}">${q.opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o[0])}" ${String(val)===o[0]?"checked":""} ${disabled?"disabled":""}><span>${esc(o[1])}</span></label>`).join("")}</div>`;
}
function statusHTML(a){
  if(!a) return `<span class="muted">${GR.maxAttempts} attempts. Full mark on the first try, ${fmtM(GR.penalty)} less for each retry.</span>`;
  if(a.correct) return `<span class="res ok">&#10003; Correct</span> <span class="muted">on attempt ${a.n} &middot; ${fmtM(qMarks(a))} / 1 mark</span>`;
  const left=GR.maxAttempts-a.n;
  return left>0 ? `<span class="res bad">&#10007; Incorrect</span> <span class="muted">${left} attempt${left>1?"s":""} left. Recheck your output, change your answer and try again.</span>`
               : `<span class="res bad">&#10007; Incorrect</span> <span class="muted">No attempts left &middot; 0 / 1 mark</span>`;
}
function qBlock(T, q, i, a, draft, live){
  const locked = !live || (a && (a.correct || a.n>=GR.maxAttempts));
  const val = a ? (a.correct||a.n>=GR.maxAttempts ? a.ans : (draft[q.id]??a.ans)) : draft[q.id];
  const cls = a ? (a.correct?" good":(a.n>=GR.maxAttempts?" bad":" retry")) : "";
  return `<div class="tq${cls}" data-q="${q.id}"><span class="ql"><span class="pts">1 mark</span><span class="qn">${i+1}.</span>${esc(q.label)}</span>
    ${fieldHTML(q, val, locked)}
    <div class="row qrow">${live && !locked ? `<button class="btn sm chkq" type="button">${a?"Check again":"Check answer"}</button>`:""}<span class="qstat" aria-live="polite">${live?statusHTML(a):""}</span></div></div>`;
}
async function renderTask(el, tid){
  const T=TASKS[tid]; S.drafts=S.drafts||{}; const draft=S.drafts[tid]=S.drafts[tid]||{};
  const head = T.exit ? `<p class="kicker">Wrap-up &middot; graded</p><h2>Exit quiz</h2><p class="lead">${T.intro}</p>`
   : `<p class="kicker">Practical ${T.p} &middot; Extra task &middot; graded</p><h2>${T.title}</h2><p class="lead">${T.intro} Do the work in <b>${T.lang}</b>, not on this site.</p>
     <h3>1. Download the image${T.files.length>1?"s":""}</h3><div class="dl-row">${T.files.map(f=>`<a class="dl" href="assets/${f[0]}" download="${f[0]}"><img src="assets/${f[0]}" alt=""><div><b>${f[0]}</b><small class="muted">${f[1]}</small><br><span>&#8595; Download</span></div></a>`).join("")}</div>
     <h3>2. Do it in ${T.lang}</h3><ol class="prose">${T.steps.map(x=>`<li>${x}</li>`).join("")}</ol>
     <div class="callout">There is no code to copy for this task. Write <code>${T.script}</code> yourself using the commands from the practical. Keep your script: your teacher may ask to see it.</div>
     <h3>3. Check your answers</h3>`;
  el.innerHTML = head + `<div id="tbody"></div>`;
  const body=el.querySelector('#tbody');
  if(AUTH.state!=="in"){
    body.innerHTML = authCard() + `<p class="muted">Questions you'll answer:</p>` + T.qs.map((q,i)=>qBlock(T,q,i,null,draft,false)).join("");
    return;
  }
  body.innerHTML=`<p class="muted">Loading your progress…</p>`;
  const here=cur;
  try{ await loadAttempts(); }catch(e){ body.innerHTML=`<p class="err">Couldn't load your progress: ${esc(e.code||e.message)}</p>`; return; }
  if(cur!==here) return;
  const paint=()=>{
    const sc=taskScore(tid);
    body.innerHTML=`<div class="scorebar"><span><b>${fmtM(sc.score)}</b> / ${sc.max} marks</span><span class="muted">${sc.done} of ${sc.total} questions finished &middot; saved to your account</span></div>
      <p class="muted">Each answer is checked as soon as you press <b>Check answer</b>. If it's wrong, recheck your ${T.exit?"notes":T.lang+" output"}, change it and check again.</p>
      ${T.qs.map((q,i)=>qBlock(T,q,i,(ATT[tid]||{})[q.id],draft,true)).join("")}
      ${sc.done===sc.total?`<div class="callout green"><b>Task complete: ${fmtM(sc.score)} / ${sc.max}.</b> ${T.exit?"Well done.":"Move on to the next practical when you're ready."}</div>`:""}`;
    body.querySelectorAll('.tq').forEach(box=>{
      const q=T.qs.find(x=>x.id===box.dataset.q); const btn=box.querySelector('.chkq'); if(!btn) return;
      const readVal=()=>{ if(q.type==="choice"){ const r=box.querySelector('input:checked'); return r?r.value:""; } return box.querySelector('input').value.trim(); };
      box.addEventListener('input',()=>{ draft[q.id]=readVal(); save(); });
      box.addEventListener('change',()=>{ draft[q.id]=readVal(); save(); });
      const go=async()=>{
        const st=box.querySelector('.qstat'); let v=readVal();
        if(!v){ st.innerHTML=`<span class="err">${q.type==="choice"?"Pick an option first.":"Type your answer first."}</span>`; return; }
        if(q.type==="num"){ v=v.replace(/,/g,""); if(!/^-?\d+(\.\d+)?$/.test(v)){ st.innerHTML=`<span class="err">Enter a number only, for example 1234.</span>`; return; } v=Number(v); }
        const prev=(ATT[tid]||{})[q.id];
        if(prev && String(prev.ans)===String(v) && !prev.correct){ st.innerHTML=`<span class="err">That's the answer you already tried. Change it first.</span>`; return; }
        btn.disabled=true; st.innerHTML=`<span class="muted">Checking…</span>`;
        let n=(prev?prev.n:0)+1;
        try{
          let ok;
          try{ ok=await window.FB.attempt(AUTH.user.uid, tid, q.id, v, n); }
          catch(e){
            if(e.code!=="permission-denied") throw e;
            // maybe answered on another device: refresh and retry once with the server's count
            await loadAttempts(true); const p2=(ATT[tid]||{})[q.id];
            if(p2 && (p2.correct || p2.n>=GR.maxAttempts)){ paint(); toast("Already finished on another device"); return; }
            const n2=(p2?p2.n:0)+1; if(n2===n) throw e; n=n2;
            ok=await window.FB.attempt(AUTH.user.uid, tid, q.id, v, n);
          }
          (ATT[tid]=ATT[tid]||{})[q.id]={uid:AUTH.user.uid, tid, qid:q.id, ans:v, n, correct:ok, at:new Date()};
          if(ok){ delete draft[q.id]; save(); }
          toast(ok?"Correct":"Incorrect"); renderToc(); paint();
          const again=body.querySelector(`.tq[data-q="${q.id}"]`); if(again) again.scrollIntoView({block:"nearest"});
        }catch(e){ btn.disabled=false;
          st.innerHTML=`<span class="err">${e.code==="permission-denied"?"Couldn't check this answer. Either no attempts are left or your teacher hasn't loaded the answer key yet.":"Couldn't check: "+esc(e.code||e.message)+". Check your connection and try again."}</span>`; }
      };
      btn.onclick=go;
      if(q.type==="num") box.querySelector('input').addEventListener('keydown',e=>{ if(e.key==="Enter") go(); });
    });
  };
  paint();
}

/* ================= MY MARKS ================= */
async function renderMyMarks(el){
  el.innerHTML=`<p class="kicker">Wrap-up</p><h2>My marks</h2><div id="mm"></div>`;
  const mm=el.querySelector('#mm');
  if(AUTH.state!=="in"){ mm.innerHTML=authCard(); return; }
  mm.innerHTML=authCard()+`<p class="muted">Loading…</p>`;
  try{ await loadAttempts(true); }catch(e){ mm.innerHTML=authCard()+`<p class="err">Couldn't load marks: ${esc(e.code||e.message)}</p>`; return; }
  const secOf={t14a:"a-task",t14b:"b-task",t14c:"d-task",t15a:"e-task",t15b:"f-task",exit:"w-exit"};
  let tot=0, max=0;
  const rows=TASK_ORDER.map(t=>{ const T=TASKS[t]; const s=taskScore(t); tot+=s.score; max+=s.max;
    const st = s.done===s.total ? `<span class="status sub">&#10003; Complete</span>` : (s.done||Object.keys(ATT[t]||{}).length) ? `<span class="status not">${s.done} of ${s.total} done</span>` : `<span class="status not">Not started</span>`;
    return `<tr><td>${T.exit?"Exit quiz":T.p}</td><td><a href="#${secOf[t]}">${esc(T.title)}</a></td><td>${st}</td><td class="n">${fmtM(s.score)} / ${s.max}</td></tr>`; }).join("");
  mm.innerHTML=authCard()+`<div class="tbl-wrap"><table class="mk"><thead><tr><th>Part</th><th>Task</th><th>Status</th><th>Marks</th></tr></thead><tbody>${rows}</tbody>
   <tfoot><tr><th colspan="3">Total</th><th class="n">${fmtM(tot)} / ${max}</th></tr></tfoot></table></div>
   <p class="muted">Marks update as soon as you check an answer and are stored in your account, so they are the same on any device. Each question allows ${GR.maxAttempts} attempts; a correct answer scores 1 on the first try and ${fmtM(GR.penalty)} less for each retry.</p>`;
}

/* ================= NAV ================= */
const idx=id=>SECTIONS.findIndex(s=>s.id===id);
let cur = SECTIONS[0].id;
function renderToc(){
  const t=document.getElementById('toc'); let g=null, h='';
  SECTIONS.forEach(s=>{ if(s.group!==g){ if(g!==null) h+='</ol>'; g=s.group; h+=`<h4>${g}</h4><ol>`; }
    const d = s.done ? s.done() : false;
    h+=`<li><a href="#${s.id}" ${s.id===cur?'aria-current="page"':''}><span class="tick">${d?'&#10003;':''}</span>${s.title}</a></li>`; });
  t.innerHTML=h+'</ol>';
}
function go(id){ if(location.hash!=='#'+id) location.hash=id; else show(id); }
function show(id, keep){
  if(idx(id)<0) id=SECTIONS[0].id; cur=id; const i=idx(id), s=SECTIONS[i];
  const m=document.getElementById('main');
  m.innerHTML=`<section class="sec" id="sec"></section><nav class="pager" aria-label="Section navigation">
    <button class="btn ghost" id="prv" ${i===0?'disabled':''}>&larr; Previous</button>
    <div class="mid">${i+1} of ${SECTIONS.length}<br><span class="hint-keys">Use &larr; &rarr; keys</span></div>
    <button class="btn" id="nxt" ${i===SECTIONS.length-1?'disabled':''}>Next &rarr;</button></nav>`;
  s.render(m.querySelector('#sec'));
  m.querySelector('#prv').onclick=()=>go(SECTIONS[i-1].id);
  m.querySelector('#nxt').onclick=()=>go(SECTIONS[i+1].id);
  document.getElementById('progBar').style.width=((i+1)/SECTIONS.length*100)+'%';
  document.title = s.title+' | DIP Practicals 14-15';
  renderToc(); document.body.classList.remove('toc-open'); if(!keep) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b){ e.preventDefault(); go(b.dataset.go); } });
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey) return;
  const i=idx(cur);
  if(e.key==='ArrowRight'&&i<SECTIONS.length-1) go(SECTIONS[i+1].id);
  if(e.key==='ArrowLeft'&&i>0) go(SECTIONS[i-1].id);
});
document.getElementById('menuBtn').onclick=()=>document.body.classList.toggle('toc-open');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('toc-open');
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement; const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark'; try{ localStorage.setItem(KEY+'-theme',r.dataset.theme); }catch(e){} show(cur);
};
try{ const th=localStorage.getItem(KEY+'-theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
show(location.hash.slice(1)||SECTIONS[0].id);
</script>
<script type="module">
/* Firebase connection. Loads only when config.js has a real config. */
const V = "10.12.2";
const cfg = window.FIREBASE_CONFIG || {};
async function boot(){
  if (window.FB_MOCK){ window.FB = window.FB_MOCK; return; }
  if (!cfg.apiKey || String(cfg.apiKey).startsWith("PASTE")){ window.FB = null; return; }
  try{
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const U = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = A.initializeApp(cfg);
    const auth = U.getAuth(app); const db = D.getFirestore(app);
    const provider = new U.GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
    try{ await U.getRedirectResult(auth); }catch(e){}
    const get1 = async (c,id)=>{ const s = await D.getDoc(D.doc(db,c,id)); return s.exists()? s.data() : null; };
    window.FB = {
      onChange: cb => U.onAuthStateChanged(auth, cb),
      signIn: async ()=>{ try{ await U.signInWithPopup(auth, provider); }
        catch(e){ if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) await U.signInWithRedirect(auth, provider); else if (e.code!=="auth/popup-closed-by-user") throw e; } },
      signOut: ()=>U.signOut(auth),
      getProfile: uid => get1("users", uid),
      register: async (uid, email, name, enr)=>{
        const b = D.writeBatch(db);
        b.set(D.doc(db,"enrollments",enr), {uid, createdAt:D.serverTimestamp()});
        b.set(D.doc(db,"users",uid), {uid, name, enrollment:enr, email, createdAt:D.serverTimestamp()});
        await b.commit();
      },
      listAttempts: async uid => (await D.getDocs(D.query(D.collection(db,"attempts"), D.where("uid","==",uid)))).docs.map(d=>d.data()),
      attempt: async (uid, tid, qid, ans, n) => {
        const ref = D.doc(db, "attempts", `${uid}__${tid}__${qid}`);
        const base = {uid, tid, qid, ans, n, at:D.serverTimestamp()};
        // The rules accept correct:true only if the answer matches the hidden key, and correct:false only if it doesn't.
        try{ await D.setDoc(ref, {...base, correct:true}); return true; }
        catch(e){ if(e.code!=="permission-denied") throw e; }
        await D.setDoc(ref, {...base, correct:false}); return false;
      },
      getProgress: uid => get1("progress", uid),
      saveProgress: (uid, steps) => D.setDoc(D.doc(db,"progress",uid), {uid, steps, updatedAt:D.serverTimestamp()})
    };
  }catch(e){ console.error("Firebase failed to load", e); window.FB = null; window.FB_ERROR = String(e); }
}
await boot();
window.dispatchEvent(new Event("fb-ready"));
</script>
