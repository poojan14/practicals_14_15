<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Teacher dashboard | DIP Practicals 14-15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF; --surface:#F5F7FA; --line:#DCE3EB; --ink:#1A2433; --ink-2:#4A5568; --muted:#718096; --blue:#1F4E8C; --blue-soft:#E7EFF9; --green:#2E7D5B; --green-soft:#E6F3EC; --red:#B4472F; --red-soft:#FBEAE5; --amber:#9A6A00; --amber-soft:#FFF4CC;
  --serif:"Source Serif 4", Cambria, Georgia, serif; --sans:"Source Sans 3", Calibri, "Segoe UI", Arial, sans-serif; --mono:"Source Code Pro", Consolas, monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151A21; --surface:#1C232C; --line:#2F3B49; --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9; --blue:#7FAEE8; --blue-soft:#1F3049; --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420; --amber:#E9C46A; --amber-soft:#3B3418}}
:root[data-theme="dark"]{--bg:#151A21; --surface:#1C232C; --line:#2F3B49; --ink:#E6EBF1; --ink-2:#B8C2CF; --muted:#8C99A9; --blue:#7FAEE8; --blue-soft:#1F3049; --green:#6CC59B; --green-soft:#1C3328; --red:#EC8A72; --red-soft:#3A2420; --amber:#E9C46A; --amber-soft:#3B3418}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
[hidden]{display:none !important}
.top{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; padding:10px 22px}
.top h1{font-family:var(--serif); font-size:20px; margin:0; flex:1}
.top .who{font-size:14px; color:var(--ink-2)}
main{padding:24px clamp(16px,3vw,32px) 60px; max-width:1400px; margin:0 auto}
h2{font-family:var(--serif); font-size:24px; margin:0 0 10px}
h3{font-size:18px; margin:24px 0 8px}
.btn{border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:8px; padding:7px 14px; cursor:pointer; font-weight:600}
.btn.ghost{background:transparent; color:var(--blue); border-color:var(--line)}
.btn.danger{background:transparent; color:var(--red); border-color:var(--red)}
.btn.sm{padding:4px 10px; font-size:14px}
.btn:disabled{opacity:.5; cursor:default}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.card{border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--surface); margin:0 0 16px}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:0 0 18px}
.stat{border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.stat b{display:block; font-family:var(--serif); font-size:30px; color:var(--blue); line-height:1.1}
.stat span{font-size:14px; color:var(--ink-2)}
.tabs{display:flex; gap:4px; border-bottom:2px solid var(--line); margin:0 0 16px; flex-wrap:wrap}
.tabs button{background:none; border:0; padding:8px 14px; cursor:pointer; color:var(--ink-2); border-bottom:3px solid transparent; margin-bottom:-2px; font-weight:600}
.tabs button[aria-selected="true"]{color:var(--blue); border-bottom-color:var(--blue)}
.wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
th{background:var(--surface); font-size:14px; position:sticky; top:0; cursor:pointer; user-select:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--blue-soft)}
td.n{font-family:var(--mono); text-align:right}
.pill{display:inline-block; border-radius:999px; padding:1px 8px; font-size:13px; font-weight:600}
.pill.ok{background:var(--green-soft); color:var(--green)} .pill.no{background:var(--surface); color:var(--muted); border:1px solid var(--line)} .pill.warn{background:var(--amber-soft); color:var(--amber)}
.bar{display:inline-block; width:60px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; vertical-align:middle; margin-right:6px}
.bar i{display:block; height:100%; background:var(--green)}
input[type=search], input[type=number], textarea, select{border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:var(--bg)}
textarea{width:100%; min-height:320px; font-family:var(--mono); font-size:13px}
.err{color:var(--red)} .muted{color:var(--muted)} .good{color:var(--green)} .bad{color:var(--red)}
dialog{border:1px solid var(--line); border-radius:12px; padding:0; width:min(920px,96vw); max-height:90vh; background:var(--bg); color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dhead{display:flex; justify-content:space-between; align-items:start; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg)}
.dbody{padding:16px 20px 24px}
.ans td{white-space:normal; vertical-align:top}
.ans td.q{max-width:300px}
.mono{font-family:var(--mono)}
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50}
.toast.show{opacity:1}
.stats{display:flex; flex-wrap:wrap; gap:28px; margin:0 0 18px}
.stats b{display:block; font-family:var(--serif); font-size:32px; color:var(--blue); line-height:1.1}
.stats span{font-size:14px; color:var(--ink-2)}
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 14px}
.link{color:var(--blue); text-decoration:underline; cursor:pointer; background:none; border:0; padding:0; font:inherit; text-align:left}
td.wrapcell{white-space:normal}
.sub{font-size:12.5px; color:var(--muted)}
tbody tr{cursor:default}
.mark{font-family:var(--mono)}
.dimc{color:var(--muted)}
</style>
</head>
<body>
<header class="top"><h1>DIP Practicals 14&ndash;15 &middot; Class dashboard</h1><span class="who" id="who"></span><span id="topBtns"></span><a class="btn ghost sm" href="./" target="_blank" rel="noopener">Open site</a></header>
<main id="main"><p class="muted">Loading…</p></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script type="module">
const V="10.12.2";
const P=window.COLLECTION_PREFIX||"dip_";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2400); };
const GR=Object.assign({maxAttempts:4, penalty:0.25}, window.GRADING||{});

/* Question text (no answers) copied from index.html */
const DET=[["prewitt","Prewitt"],["sobel","Sobel"],["roberts","Roberts"],["laplacian","Laplacian"],["canny","Canny"]];
const TASKS={
 t14a:{p:"14A", title:"Edge detection on edge.jpeg", lang:"MATLAB", script:"exp14a.m", sec:"a-steps",
  files:[["edge.jpeg","Crane and metro viaduct, colour photo"]],
  qs:[{id:"rows",type:"num",label:"size(I): number of rows in edge.jpeg"},
      {id:"cols",type:"num",label:"size(I): number of columns"},
      {id:"ch",type:"num",label:"size(I): number of channels (before rgb2gray)"},
      {id:"prewitt",type:"num",label:"Prewitt: number of edge pixels, nnz(BW_prewitt)"},
      {id:"sobel",type:"num",label:"Sobel: number of edge pixels, nnz(BW_sobel)"},
      {id:"roberts",type:"num",label:"Roberts: number of edge pixels, nnz(BW_roberts)"},
      {id:"lap",type:"num",label:"Laplacian (zero crossings): number of edge pixels, nnz(BW_lap)"},
      {id:"canny",type:"num",label:"Canny: number of edge pixels, nnz(BW_canny)"},
      {id:"most",type:"choice",label:"Which detector marked the MOST edge pixels?",opts:DET},
      {id:"fewest",type:"choice",label:"Which detector marked the FEWEST edge pixels?",opts:DET},
      {id:"sky",type:"choice",label:"Look at the cloudy sky in your Laplacian result. What do you see?",opts:[["noise","Many small, scattered edge pixels"],["blank","No edge pixels at all"],["outline","Only the outline of the crane"],["white","The whole sky turns white"]]}]},
 t14b:{p:"14B", title:"Erosion on d1.jpeg", lang:"MATLAB", script:"exp14b.m", sec:"b-steps",
  files:[["d1.jpeg","Chip with pins and thin wires"]],
  qs:[{id:"n0",type:"num",label:"nnz(I) for the original image"},
      {id:"e3",type:"num",label:"nnz(E1) after erosion with strel('square', 3)"},
      {id:"e7",type:"num",label:"nnz(E2) after erosion with strel('square', 7)"},
      {id:"e11",type:"num",label:"nnz(E3) after erosion with strel('square', 11)"},
      {id:"why",type:"choice",label:"d1.jpeg is 300 x 300, yet nnz(I) is much larger than 90,000. Why?",opts:[["ch","I is a colour image, so nnz counts non-zero values in all 3 channels"],["jpeg","JPEG compression adds extra pixels"],["edge","nnz counts edge pixels twice"],["bug","It is a MATLAB error"]]},
      {id:"trend",type:"choice",label:"As the square SE grows from 3 to 7 to 11, the nnz count…",opts:[["down","decreases"],["up","increases"],["same","stays the same"]]},
      {id:"wires3",type:"choice",label:"With the 3x3 SE, what happens to the thin diagonal wires?",opts:[["most","Most of them disappear; only the thicker wires remain"],["thick","They become thicker"],["none","Nothing changes"],["pins","The wires stay but the pins disappear"]]},
      {id:"allw",type:"choice",label:"Which SE size is the first to remove ALL the wires, while the pins and centre square remain?",opts:[["3","3x3"],["7","7x7"],["11","11x11"],["no","None of them"]]}]},
 t14c:{p:"14C", title:"Dilation on cameraman.jpeg", lang:"MATLAB", script:"exp14c.m", sec:"d-steps",
  files:[["cameraman.jpeg","The cameraman photo"]],
  qs:[{id:"inv",type:"choice",label:"Why does the program use ~ in BW = ~im2bw(I, graythresh(I))?",opts:[["obj","im2bw makes the dark cameraman black; ~ makes him the white object that imdilate grows"],["noise","To remove noise"],["fast","To make imdilate faster"],["size","To change the image size"]]},
      {id:"bw",type:"num",label:"nnz(BW): white pixels in the binary image"},
      {id:"d3",type:"num",label:"nnz(D1) after dilation with strel('square', 3)"},
      {id:"d7",type:"num",label:"nnz(D2) after dilation with strel('square', 7)"},
      {id:"d11",type:"num",label:"nnz(D3) after dilation with strel('square', 11)"},
      {id:"trend",type:"choice",label:"As the square SE grows from 3 to 7 to 11, the white-pixel count…",opts:[["up","increases"],["down","decreases"],["same","stays the same"]]},
      {id:"tripod",type:"choice",label:"With the 11x11 SE, what happens to the thin tripod legs?",opts:[["thick","They become thick and merge into a solid shape"],["gone","They disappear"],["same","They stay thin"],["black","They turn black"]]}]},
 t15a:{p:"15A", title:"Opening on d1.jpeg", lang:"MATLAB", script:"exp15a.m", sec:"e-steps",
  files:[["d1.jpeg","Chip with pins and thin wires"]],
  qs:[{id:"level",type:"choice",label:"BW1 = im2bw(A) has no level. Which threshold does MATLAB use?",opts:[["half","0.5 (pixels brighter than half of 255 become white)"],["otsu","Otsu's level, the same as graythresh"],["zero","0: every non-black pixel becomes white"],["mean","The mean brightness of the image"]]},
      {id:"bw",type:"num",label:"nnz(BW1): white pixels in the binary image"},
      {id:"o2",type:"num",label:"nnz(O1) after opening with strel('disk', 2, 0)"},
      {id:"o10",type:"num",label:"nnz(O2) after opening with strel('disk', 10, 0)"},
      {id:"r2",type:"choice",label:"What did opening with the disk of radius 2 remove?",opts:[["thin","Only the thinnest wires; a few thicker wires remain"],["all","All the wires"],["pins","The pins"],["nothing","Nothing visible"]]},
      {id:"r10",type:"choice",label:"What did opening with the disk of radius 10 remove?",opts:[["wires","All the wires; the pins and centre square stay"],["pins","The wires and all the pins"],["die","The centre square"],["nothing","Nothing visible"]]},
      {id:"keep",type:"choice",label:"Why do the pins keep almost their original size after opening, even though opening starts with erosion?",opts:[["grow","The dilation step grows back what the erosion shrank"],["never","Opening never changes large objects"],["disk","Because the SE is a disk"],["bw","Because im2bw was used first"]]}]},
 t15b:{p:"15B", title:"OpenCV on house.png", lang:"Python", script:"exp15b.py", sec:"f-steps",
  files:[["house.png","The house image, 512 x 512"]],
  qs:[{id:"h",type:"num",label:"img.shape: height"},{id:"w",type:"num",label:"img.shape: width"},{id:"c",type:"num",label:"img.shape: channels"},
      {id:"peak",type:"num",label:"Index of the tallest histogram bin of the gray image, hist.argmax()"},
      {id:"canny",type:"num",label:"cv2.Canny(gray, 100, 200): number of edge pixels, np.count_nonzero(edges)"},
      {id:"thr",type:"num",label:"cv2.threshold(gray, 127, 255, THRESH_BINARY): number of white pixels"},
      {id:"eq",type:"choice",label:"Compare the histograms before and after cv2.equalizeHist. What changed?",opts:[["spread","The values spread across the full 0 to 255 range, raising contrast"],["dark","All values moved towards 0"],["same","Nothing changed"],["noise","Noise was removed"]]},
      {id:"bgr",type:"choice",label:"If you skip cv2.cvtColor(img, cv2.COLOR_BGR2RGB) before plt.imshow, a colour photo…",opts:[["swap","shows red and blue swapped"],["gray","appears in grayscale"],["rot","appears rotated"],["same","looks exactly the same"]]}]},
 exit:{p:"Exit", title:"Exit quiz", exit:true,
  intro:"Six questions on everything in today's session. Each answer is checked as soon as you press Check answer.",
  qs:[{id:"q0",type:"choice",label:"Which detector gives the thinnest, most continuous edges?",opts:[["0","Roberts"],["1","Laplacian"],["2","Canny"],["3","Prewitt"]]},
      {id:"q1",type:"choice",label:"Which mask has a centre row weighted by 2?",opts:[["0","Prewitt"],["1","Sobel"],["2","Roberts"]]},
      {id:"q2",type:"choice",label:"Erosion with a larger structuring element…",opts:[["0","removes more"],["1","removes less"],["2","has no effect"]]},
      {id:"q3",type:"choice",label:"Closing is…",opts:[["0","erosion then dilation"],["1","dilation then erosion"],["2","dilation twice"]]},
      {id:"q4",type:"choice",label:"cv2.imread loads colour channels in which order?",opts:[["0","RGB"],["1","BGR"],["2","HSV"]]},
      {id:"q5",type:"choice",label:"Histogram equalization mainly improves…",opts:[["0","noise"],["1","contrast"],["2","resolution"]]}]}
};
const PARTS=[["14A","t14a"],["14B","t14b"],["14C","t14c"],["15A","t15a"],["15B","t15b"],["Exit","exit"]];
const STEP_TOTAL={"14A":11,"14B":6,"14C":7,"15A":7,"15B":11};
const STEP_SUM=Object.values(STEP_TOTAL).reduce((a,b)=>a+b,0);
const QMAX=PARTS.reduce((a,[,t])=>a+TASKS[t].qs.length,0);
const ansText=(q,v)=>{ if(v===undefined||v===null||v==="") return ""; if(q.type==="choice"){ const o=q.opts.find(o=>o[0]===String(v)); return o?o[1]:String(v); } const n=Number(String(v).replace(/,/g,"")); return Number.isFinite(n)?n:String(v); };
const r2=x=>Math.round(x*100)/100;
const qMarks=a=>a&&a.correct?Math.max(0,1-GR.penalty*(a.n-1)):0;
const tms=t=>t&&t.toDate?t.toDate().getTime():(typeof t==="number"?t:0);
const fmt=t=>t?new Date(t).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}):"–";

const main=$("#main");
const cfg=window.FIREBASE_CONFIG||{};
if(!cfg.apiKey||String(cfg.apiKey).startsWith("PASTE")){ main.innerHTML=`<div class="card"><h2>Not connected</h2><p>Paste your Firebase web config into <code>config.js</code> first. See DEPLOY.md.</p></div>`; throw new Error("no config"); }

const A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
const U=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
const D=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
const app=A.initializeApp(cfg,"dip-dash"); const auth=U.getAuth(app); const db=D.getFirestore(app);
const provider=new U.GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
try{ await U.getRedirectResult(auth); }catch(e){}

let KEY=null, ROWS=[], ATTS=[], TAB="students", SORT={k:"enrollment",dir:1};

U.onAuthStateChanged(auth, async u=>{
  if(!u){ $("#who").textContent=""; $("#topBtns").innerHTML="";
    main.innerHTML=`<div class="card"><h2>Teacher sign-in</h2><p>Sign in with a teacher Google account listed in <code>dipIsTeacher()</code> in the Firestore rules.</p><button class="btn" id="si">Sign in with Google</button></div>`;
    $("#si").onclick=async()=>{ try{ await U.signInWithPopup(auth,provider); }catch(e){ if(e.code==="auth/popup-blocked") U.signInWithRedirect(auth,provider); else toast(e.code||e.message); } };
    return; }
  $("#who").textContent=u.email; $("#topBtns").innerHTML=`<button class="btn ghost sm" id="so">Sign out</button>`; $("#so").onclick=()=>U.signOut(auth);
  main.innerHTML=`<p class="muted">Loading class data…</p>`;
  try{ const k=await D.getDoc(D.doc(db,P+"config","answerKey")); KEY=k.exists()?k.data():null; }
  catch(e){ main.innerHTML=`<div class="card"><h2>Not authorised</h2><p>${esc(u.email)} is not a teacher account for this site, or the DIP rules aren't published in this Firebase project. Add the email to <code>dipIsTeacher()</code> in firestore.rules and Publish.</p><p class="muted">${esc(e.code||e.message)}</p></div>`; return; }
  try{ await load(); }catch(e){ main.innerHTML=`<div class="card"><h2>Couldn't load data</h2><p class="err">${esc(e.code||e.message)}</p></div>`; }
});

async function load(){
  const col=async n=>(await D.getDocs(D.collection(db,P+n))).docs.map(d=>({_id:d.id,...d.data()}));
  const [users,prog,atts]=await Promise.all([col("users"),col("progress"),col("attempts")]);
  ATTS=atts;
  const PR={}; prog.forEach(p=>PR[p._id]=p);
  const AT={}; atts.forEach(a=>{ ((AT[a.uid]=AT[a.uid]||{})[a.tid]=AT[a.uid][a.tid]||{})[a.qid]=a; });
  ROWS=users.map(u=>{
    const pr=PR[u.uid]||{}, at=AT[u.uid]||{};
    const r={uid:u.uid, name:u.name, enrollment:u.enrollment, division:u.division||"", email:u.email, created:tms(u.createdAt), pr, at, marks:{}, total:0, done:0};
    PARTS.forEach(([p,t])=>{ let s=0, dn=0, started=false; TASKS[t].qs.forEach(q=>{ const a=(at[t]||{})[q.id]; if(a){ started=true; if(a.correct||a.n>=GR.maxAttempts) dn++; } s+=qMarks(a); });
      r.marks[p]={score:r2(s), max:TASKS[t].qs.length, started, done:dn}; r["m_"+p]=r2(s); r.total+=s; r.done+=dn; });
    r.total=r2(r.total); r.pct=Math.round(100*r.done/QMAX);
    r.steps=Object.entries(pr.steps||{}).reduce((a,[k,m])=>a+Object.values(m||{}).filter(Boolean).length,0);
    r.peeks=Object.values(pr.peeks||{}).filter(Boolean).length;
    r.checks=Object.values(at).reduce((a,o)=>a+Object.values(o).reduce((b,x)=>b+(x.n||0),0),0);
    r.last=Math.max(tms(pr.updatedAt), ...Object.values(at).flatMap(o=>Object.values(o).map(x=>tms(x.at))), 0);
    return r; });
  render();
}

function filtered(){
  const q=($("#q")?.value||"").toLowerCase(), dv=$("#dv")?.value||"";
  return ROWS.filter(r=>(!dv||r.division===dv)&&(!q||[r.name,r.enrollment,r.email].join(" ").toLowerCase().includes(q)));
}

function render(){
  const n=ROWS.length, avg=n?Math.round(ROWS.reduce((a,r)=>a+r.total,0)/n/QMAX*100):0;
  const active=ROWS.filter(r=>r.last>Date.now()-86400000).length;
  const divs=[...new Set(ROWS.map(r=>r.division).filter(Boolean))].sort();
  const q=$("#q")?.value||"", dv=$("#dv")?.value||"";
  main.innerHTML=`
  ${!KEY?`<div class="card" style="border-color:var(--amber); background:var(--amber-soft)"><b>No answer key loaded yet.</b> Students can't check answers until you open the <b>Answer key</b> tab and save <code>answer_key.json</code>. Typed answers are still saved and appear in the Excel export.</div>`:""}
  <div class="stats"><div><b>${n}</b><span>registered students</span></div><div><b>${avg}%</b><span>average marks</span></div><div><b>${active}</b><span>active in last 24 h</span></div><div><b>${QMAX}</b><span>graded questions (5 practicals + exit quiz)</span></div></div>
  <div class="tools"><input type="search" id="q" placeholder="Search name, enrollment, email" size="30" value="${esc(q)}">
    <select id="dv"><option value="">All divisions</option>${divs.map(d=>`<option ${d===dv?"selected":""}>${esc(d)}</option>`).join("")}</select>
    <button class="btn ghost" id="rl">Reload</button><button class="btn" id="xl">Export Excel</button><button class="btn ghost" id="csv">Export CSV</button><button class="btn ghost" id="rg">Regrade with current key</button></div>
  <div class="tabs" role="tablist">${[["students","Students"],["tasks","Question difficulty"],["parts","Practical completion"],["key","Answer key"],["help","Help"]].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${TAB===k}">${l}</button>`).join("")}</div>
  <div id="view"></div>`;
  $("#q").oninput=draw; $("#dv").onchange=draw;
  $("#rl").onclick=async()=>{ main.innerHTML=`<p class="muted">Reloading…</p>`; try{ const k=await D.getDoc(D.doc(db,P+"config","answerKey")); KEY=k.exists()?k.data():null; }catch(e){} await load(); };
  $("#xl").onclick=exportExcel; $("#csv").onclick=exportCsv; $("#rg").onclick=regrade;
  main.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ TAB=b.dataset.t; render(); });
  draw();
}

function draw(){
  const rows=filtered(), v=$("#view");
  if(TAB==="students"){
    const cols=[["name","Name"],["enrollment","Enrollment"],["division","Division"],...PARTS.map(([p,t])=>["m_"+p,`${p} /${TASKS[t].qs.length}`]),["total",`Total /${QMAX}`],["pct","Answered"],["steps",`Steps /${STEP_SUM}`],["checks","Checks"],["peeks","Code peeks"],["last","Last active"]];
    rows.sort((a,b)=>{ const x=a[SORT.k], y=b[SORT.k]; return (typeof x==="number"?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*SORT.dir; });
    v.innerHTML=`<div class="wrap"><table><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${esc(l)}${SORT.k===k?(SORT.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>
      <td><button class="link" data-uid="${esc(r.uid)}">${esc(r.name)}</button><br><span class="sub">${esc(r.email)}</span></td><td class="mono">${esc(r.enrollment)}</td><td>${esc(r.division)}</td>
      ${PARTS.map(([p])=>{ const m=r.marks[p]; return `<td class="n">${m.started?`<b>${m.score}</b>${m.done<m.max?` <span class="pill warn" title="questions finished">${m.done}/${m.max}</span>`:""}`:`<span class="dimc">–</span>`}</td>`; }).join("")}
      <td class="n"><b>${r.total}</b></td><td><span class="bar"><i style="width:${r.pct}%"></i></span>${r.pct}%</td>
      <td class="n">${r.steps}</td><td class="n">${r.checks}</td><td class="n">${r.peeks}</td><td>${fmt(r.last)}</td></tr>`).join("")||`<tr><td colspan="${cols.length}" class="muted">No students yet.</td></tr>`}</tbody></table></div>
      <p class="muted">Marks come from server-checked answers. Amber badge: questions finished when a task is still in progress. Steps and code peeks are self-reported progress. Click a name for answers, attempts and resets.</p>`;
    v.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; SORT={k, dir:SORT.k===k?-SORT.dir:(["name","enrollment","division"].includes(k)?1:-1)}; draw(); });
    v.querySelectorAll("[data-uid]").forEach(b=>b.onclick=()=>detail(b.dataset.uid));
  } else if(TAB==="tasks"){
    const uids=new Set(rows.map(r=>r.uid)); const n=rows.length||1;
    const stat=PARTS.flatMap(([p,t])=>TASKS[t].qs.map((q,i)=>{ const as=ATTS.filter(a=>uids.has(a.uid)&&a.tid===t&&a.qid===q.id); const ok=as.filter(a=>a.correct);
      return {p,t,q,i,att:as.length,ok:ok.length,first:ok.filter(a=>a.n===1).length,out:as.filter(a=>!a.correct&&a.n>=GR.maxAttempts).length,stuck:as.filter(a=>!a.correct).length,avg:ok.length?ok.reduce((s,a)=>s+a.n,0)/ok.length:0,
        top:Object.entries(as.filter(a=>!a.correct).reduce((m,a)=>{ const k=ansText(q,a.ans); m[k]=(m[k]||0)+1; return m; },{})).sort((a,b)=>b[1]-a[1]).slice(0,3)}; }));
    stat.sort((a,b)=>b.stuck-a.stuck||b.out-a.out);
    v.innerHTML=`<p class="muted">Sorted by students who answered but aren't correct yet. A question where many students give the <b>same</b> "wrong" answer usually means the key value differs on your MATLAB version: fix it in Answer key, then Regrade.</p>
    <div class="wrap"><table><thead><tr><th>Part</th><th>Question</th><th>Answered</th><th>Correct</th><th>First try</th><th>Not yet correct</th><th>Out of attempts</th><th>Avg attempts to pass</th><th>Most common wrong answers</th><th>Key</th></tr></thead><tbody>${stat.map(s=>{ const k=KEY&&KEY.tasks&&KEY.tasks[s.t]&&KEY.tasks[s.t][s.q.id];
      return `<tr><td>${s.p}</td><td class="wrapcell" style="max-width:340px">${s.i+1}. ${esc(s.q.label)}</td><td class="n">${s.att}</td><td class="n">${s.ok} (${Math.round(100*s.ok/n)}%)</td><td class="n">${s.first}</td><td class="n">${s.stuck}</td><td class="n">${s.out}</td><td class="n">${s.avg?s.avg.toFixed(1):"–"}</td>
      <td class="wrapcell">${s.top.map(([a,c])=>`${esc(a)} <span class="dimc">×${c}</span>`).join("<br>")}</td><td class="dimc wrapcell">${k?(k.type==="num"?`${esc(k.value)} ±${Math.round((k.tol||0)*100)}%`:esc(ansText(s.q,k.value))):"–"}</td></tr>`; }).join("")}</tbody></table></div>`;
  } else if(TAB==="parts"){
    const n=rows.length;
    v.innerHTML=`<div class="wrap"><table><thead><tr><th>Part</th><th>Task</th><th>Questions</th><th>Students finished</th><th>Average marks</th><th>Students started the steps</th><th>Average steps ticked</th></tr></thead><tbody>${PARTS.map(([p,t])=>{
      const T=TASKS[t], ms=rows.map(r=>r.marks[p]); const fin=ms.filter(m=>m.done===m.max).length; const av=n?ms.reduce((a,m)=>a+m.score,0)/n:0;
      const st=STEP_TOTAL[p]; const ticks=rows.map(r=>Object.values((r.pr.steps||{})[p]||{}).filter(Boolean).length);
      return `<tr><td>${p}</td><td>${esc(T.title)}</td><td class="n">${T.qs.length}</td><td class="n">${fin} / ${n}</td><td><span class="bar"><i style="width:${T.qs.length?av/T.qs.length*100:0}%"></i></span>${av.toFixed(2)} / ${T.qs.length}</td>
      <td class="n">${st?ticks.filter(x=>x>0).length+" / "+n:"–"}</td><td class="n">${st&&n?(ticks.reduce((a,b)=>a+b,0)/n).toFixed(1)+" / "+st:"–"}</td></tr>`; }).join("")}</tbody></table></div>`;
  } else if(TAB==="key"){
    v.innerHTML=`<div class="card"><p style="margin-top:0">Load <code>answer_key.json</code> from your computer (it is <b>not</b> in the public repository), check it, then save. Only teacher accounts can read or change the saved key. After changing values, press <b>Regrade with current key</b>.</p>
     <div class="row"><input type="file" id="kf" accept=".json,application/json"><button class="btn" id="ks">Save key to database</button><span id="km"></span></div></div>
     <textarea id="kt" spellcheck="false">${esc(KEY?JSON.stringify(KEY,null,2):"")}</textarea>`;
    $("#kf").onchange=async e=>{ const f=e.target.files[0]; if(f) $("#kt").value=await f.text(); };
    $("#ks").onclick=saveKey;
  } else {
    v.innerHTML=`<div class="card"><h3 style="margin-top:0">How it works</h3><ul>
     <li>Each question is checked when a student presses <b>Check answer</b>. The database rules compare the answer with <code>${P}config/answerKey</code>, which students can't read, so a correct result can't be faked.</li>
     <li>${GR.maxAttempts} attempts per question. Marks: 1 for correct on the first try, ${GR.penalty} less per retry, 0 if never correct. Correct answers are final.</li>
     <li>Answers students have <b>typed but not checked</b> (for example while the key was missing or wrong) are saved too, and appear in <b>Export Excel</b>.</li>
     <li><b>Export Excel</b> gives four sheets: Summary (marks per student), Answers (one row per student, one column per question), Responses (one row per student and question with attempts and result) and Answer key.</li>
     <li>Students can also download their own responses as Excel from <b>My marks</b> on the site.</li>
     <li>If you correct the key after students have answered, press <b>Regrade with current key</b>. Students who ran out of attempts on that question can be reset from their detail view.</li>
     <li>Database layout: <code>${P}users</code> (profile), <code>${P}enrollments</code> (unique enrollment numbers), <code>${P}progress</code> (one per student: steps ticked, code peeks, typed answers), <code>${P}attempts</code> (one per student per question, server-checked), <code>${P}config</code> (answer key).</li></ul></div>`;
  }
}

async function saveKey(){
  let obj; try{ obj=JSON.parse($("#kt").value); if(!obj.tasks) throw new Error("missing 'tasks'");
    for(const [t,qs] of Object.entries(obj.tasks)) for(const [qid,k] of Object.entries(qs)){
      if(!TASKS[t]||!TASKS[t].qs.find(q=>q.id===qid)) throw new Error(`${t}.${qid} isn't a question on the site`);
      if(k.type==="num"){ if(typeof k.value!=="number"||typeof k.tol!=="number") throw new Error(`${t}.${qid}: num needs numeric value and tol`); }
      else if(k.type==="choice"){ if(typeof k.value!=="string") throw new Error(`${t}.${qid}: choice value must be text in quotes`); const q=TASKS[t].qs.find(q=>q.id===qid); if(q.opts&&!q.opts.find(o=>o[0]===k.value)) throw new Error(`${t}.${qid}: "${k.value}" isn't one of the options (${q.opts.map(o=>o[0]).join(", ")})`); }
      else throw new Error(`${t}.${qid}: type must be num or choice`); }
  }catch(e){ $("#km").innerHTML=`<span class="err">Invalid key: ${esc(e.message)}</span>`; return; }
  try{ await D.setDoc(D.doc(db,P+"config","answerKey"), obj); KEY=obj; toast("Answer key saved"); render(); }catch(e){ $("#km").innerHTML=`<span class="err">${esc(e.code||e.message)}</span>`; }
}
function isRight(k,a){ if(!k) return false; if(k.type==="num") return typeof a==="number" && Math.abs(a-k.value)<=Math.abs(k.value)*k.tol+1e-9; return typeof a==="string" && a===k.value; }
async function regrade(){
  if(!KEY){ toast("Load the answer key first"); return; }
  const ch=ATTS.filter(a=>{ const k=(KEY.tasks[a.tid]||{})[a.qid]; return k && isRight(k,a.ans)!==!!a.correct; });
  if(!ch.length){ toast("All stored answers already match the key"); return; }
  if(!confirm(`${ch.length} stored answer(s) change result with the current key. Update them?`)) return;
  try{ for(let i=0;i<ch.length;i+=400){ const b=D.writeBatch(db); ch.slice(i,i+400).forEach(a=>b.update(D.doc(db,P+"attempts",a._id),{correct:isRight(KEY.tasks[a.tid][a.qid],a.ans)})); await b.commit(); }
    toast(`Regraded ${ch.length} answer(s)`); await load(); }catch(e){ toast("Regrade failed: "+(e.code||e.message)); }
}

function detail(uid){
  const r=ROWS.find(x=>x.uid===uid); if(!r) return; const dlg=$("#dlg"); const typed=r.pr.answers||{};
  dlg.innerHTML=`<div class="dhead"><div><h2 style="margin:0">${esc(r.name)} &middot; ${esc(r.enrollment)}</h2><div class="muted">${esc(r.email)}${r.division?" &middot; "+esc(r.division):""} &middot; registered ${fmt(r.created)}</div>
    <div style="margin-top:4px"><b>Total ${r.total} / ${QMAX}</b> &middot; ${r.pct}% answered &middot; ${r.steps}/${STEP_SUM} steps ticked &middot; ${r.peeks} code peek${r.peeks===1?"":"s"} &middot; last active ${fmt(r.last)}</div></div><button class="btn ghost sm" id="dc">Close</button></div>
  <div class="dbody">${PARTS.map(([p,t])=>{ const m=r.marks[p], at=r.at[t]||{}, ty=typed[t]||{}, any=m.started||Object.keys(ty).length;
    const peeks=Object.keys(r.pr.peeks||{}).filter(k=>k.startsWith(p+".")).map(k=>+k.split(".")[1]+1).sort((a,b)=>a-b);
    return `<h3>${p}: ${esc(TASKS[t].title)} <b>${m.score}/${m.max}</b> ${m.started?`<button class="btn danger sm" data-rt="${t}">Reset task</button>`:""}</h3>
    ${peeks.length?`<p class="muted" style="margin:0 0 6px">Opened "Show the code" on steps ${peeks.join(", ")}</p>`:""}
    ${any?`<div class="wrap"><table class="ans"><thead><tr><th>Q</th><th>Question</th><th>Last checked answer</th><th>Typed, not checked</th><th>Attempts</th><th>Result</th><th>Marks</th><th>Key</th><th></th></tr></thead><tbody>${TASKS[t].qs.map((q,i)=>{ const a=at[q.id], k=KEY&&KEY.tasks&&KEY.tasks[t]&&KEY.tasks[t][q.id];
      return `<tr><td>${i+1}</td><td class="q">${esc(q.label)}</td><td>${a?esc(ansText(q,a.ans)):"<span class='dimc'>–</span>"}</td><td>${ty[q.id]!==undefined&&!(a&&a.correct)?esc(ansText(q,ty[q.id])):""}</td><td class="n">${a?a.n:0}/${GR.maxAttempts}</td>
      <td>${!a?"":a.correct?`<span class="good">✓ correct</span>`:(a.n>=GR.maxAttempts?`<span class="bad">✗ out of attempts</span>`:`<span class="bad">✗ trying</span>`)}</td><td class="n">${r2(qMarks(a))}</td>
      <td class="dimc">${k?(k.type==="num"?`${esc(k.value)} ±${Math.round((k.tol||0)*100)}%`:esc(ansText(q,k.value))):"–"}</td><td>${a?`<button class="btn ghost sm" data-rq="${t}__${esc(q.id)}">Reset</button>`:""}</td></tr>`; }).join("")}</tbody></table></div>`:`<p class="muted">Not started.</p>`}`; }).join("")}
   <div class="row" style="margin-top:20px"><button class="btn danger" id="rr">Reset registration</button><span class="muted">Deletes name, enrollment and division so the student can register again with corrected details. Answers are kept.</span></div></div>`;
  dlg.showModal(); $("#dc").onclick=()=>dlg.close();
  const del=async ids=>{ const b=D.writeBatch(db); ids.forEach(id=>b.delete(D.doc(db,P+"attempts",id))); await b.commit(); };
  dlg.querySelectorAll("[data-rq]").forEach(b=>b.onclick=async()=>{ const [t,qid]=b.dataset.rq.split("__"); if(!confirm(`Reset ${r.name}'s attempts on this question?`)) return;
    try{ await del([`${uid}__${t}__${qid}`]); toast("Question reset"); await load(); detail(uid); }catch(e){ toast(e.code||e.message); } });
  dlg.querySelectorAll("[data-rt]").forEach(b=>b.onclick=async()=>{ const t=b.dataset.rt; if(!confirm(`Reset all of ${r.name}'s attempts on ${t}?`)) return;
    try{ await del(Object.keys(r.at[t]||{}).map(qid=>`${uid}__${t}__${qid}`)); toast("Task reset"); await load(); detail(uid); }catch(e){ toast(e.code||e.message); } });
  $("#rr").onclick=async()=>{ if(!confirm(`Reset ${r.name} (${r.enrollment})? They will register again. Answers are kept.`)) return;
    try{ const b=D.writeBatch(db); b.delete(D.doc(db,P+"users",uid)); b.delete(D.doc(db,P+"enrollments",r.enrollment)); await b.commit(); toast("Registration reset"); dlg.close(); await load(); }catch(e){ toast(e.code||e.message); } };
}

/* ---------- exports ---------- */
function latestAnswer(r,t,q){ const a=(r.at[t]||{})[q.id], ty=((r.pr.answers||{})[t]||{})[q.id];
  if(ty!==undefined && String(ty)!=="" && !(a&&a.correct)) return {v:ty, checked:a&&String(a.ans)===String(ty)};
  return {v:a?a.ans:"", checked:!!a}; }
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error("Couldn't load the Excel library")); document.head.appendChild(s); }); }
const cellSafe=v=>{ if(typeof v!=="string") return v; return /^[=+\-@]/.test(v)?"'"+v:v; };
function summaryRows(rows){
  return [["Name","Enrollment","Division","Email",...PARTS.map(([p,t])=>`${p} (/${TASKS[t].qs.length})`),`Total (/${QMAX})`,"Answered %","Steps ticked","Checks","Code peeks","Last active"],
    ...rows.map(r=>[r.name,r.enrollment,r.division,r.email,...PARTS.map(([p])=>r.marks[p].score),r.total,r.pct,r.steps,r.checks,r.peeks,r.last?new Date(r.last).toLocaleString():""])]; }
async function exportExcel(){
  let X; try{ X=await loadXLSX(); }catch(e){ toast(e.message); return; }
  const rows=filtered().sort((a,b)=>String(a.enrollment).localeCompare(String(b.enrollment),undefined,{numeric:true}));
  const qcols=PARTS.flatMap(([p,t])=>TASKS[t].qs.map((q,i)=>({p,t,q,i})));
  const wide=[["Name","Enrollment","Division",...qcols.map(c=>`${c.p} Q${c.i+1}: ${c.q.label}`)],
    ...rows.map(r=>[r.name,r.enrollment,r.division,...qcols.map(c=>{ const la=latestAnswer(r,c.t,c.q); return ansText(c.q,la.v); })])];
  const long=[["Name","Enrollment","Division","Part","Q no.","Question","Latest answer","Status","Attempts","Result","Marks","Key"]];
  rows.forEach(r=>qcols.forEach(c=>{ const a=(r.at[c.t]||{})[c.q.id], la=latestAnswer(r,c.t,c.q), k=KEY&&KEY.tasks&&KEY.tasks[c.t]&&KEY.tasks[c.t][c.q.id];
    long.push([r.name,r.enrollment,r.division,c.p,c.i+1,c.q.label,ansText(c.q,la.v),la.v===""?"":(la.checked?"checked":"typed, not checked"),a?a.n:0,a?(a.correct?"correct":(a.n>=GR.maxAttempts?"incorrect, no attempts left":"incorrect")):"",r2(qMarks(a)),k?(k.type==="num"?`${k.value} ±${Math.round((k.tol||0)*100)}%`:ansText(c.q,k.value)):""]); }));
  const keyRows=[["Part","Q no.","Question","Type","Answer","Tolerance"],...qcols.map(c=>{ const k=KEY&&KEY.tasks&&KEY.tasks[c.t]&&KEY.tasks[c.t][c.q.id]; return [c.p,c.i+1,c.q.label,k?k.type:"",k?(k.type==="num"?k.value:ansText(c.q,k.value)):"",k&&k.type==="num"?k.tol:""]; })];
  const wb=X.utils.book_new(); const add=(name,aoa,w)=>{ const ws=X.utils.aoa_to_sheet(aoa.map(r=>r.map(cellSafe))); if(w) ws["!cols"]=w.map(x=>({wch:x})); X.utils.book_append_sheet(wb,ws,name); };
  add("Summary",summaryRows(rows),[24,16,18,30,8,8,8,8,8,8,10,10,10,8,10,20]);
  add("Answers",wide,[24,16,18,...qcols.map(()=>16)]);
  add("Responses",long,[24,16,18,6,6,60,20,18,9,26,7,16]);
  add("Answer key",keyRows,[6,6,70,8,26,10]);
  X.writeFile(wb,`DIP_14_15_class_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function exportCsv(){
  const lines=summaryRows(filtered());
  const csv=lines.map(l=>l.map(x=>{ let s=String(cellSafe(x??"")); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download=`DIP_14_15_marks_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
